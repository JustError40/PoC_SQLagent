[project]
name = "sqlagent-poc"
version = "0.1.0"
description = "Self-evolving database-skill environment for a SQL agent"
requires-python = ">=3.10,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "langgraph>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pyyaml>=6.0,<7",
  "sqlparse>=0.5,<1",
  "faker>=26,<40",
  "fastapi>=0.115,<0.117",
  "uvicorn[standard]>=0.30,<1",
  "sqlglot>=30.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
sqlagent = "sqlagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sqlagent*", "db_seed*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running PostgreSQL container",
  "slow: requires a running Ollama model",
]

[tool.ruff]
line-length = 100
