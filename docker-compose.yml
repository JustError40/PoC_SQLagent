services:
  postgres:
    image: postgres:16
    container_name: sqlagent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: sqlagent-api-${SKILL_NAME:-warehouse_prod}
    extra_hosts:
      # Reach the LiteLLM proxy (and other services) running on the Docker host.
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${TARGET_DB:-warehouse}
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://host.docker.internal:8445/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env}
      LITELLM_MODEL: ${LITELLM_MODEL:-hosted_vllm/gemma4-chat}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-deepseek-v4-flash}
      WORKSPACE_PATH: /app/skills/${SKILL_NAME:-warehouse_prod}
      EXPLORER_ROUNDS: ${EXPLORER_ROUNDS:-3}
      EXPLORER_PROBES_PER_ROUND: ${EXPLORER_PROBES_PER_ROUND:-3}
      REACT_MAX_ATTEMPTS: ${REACT_MAX_ATTEMPTS:-15}
      REACT_OPTIMIZE_MS: ${REACT_OPTIMIZE_MS:-10000}
      STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-120000}
      BOOTSTRAP_ON_START: ${BOOTSTRAP_ON_START:-1}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./skills/${SKILL_NAME:-warehouse_prod}:/app/skills/${SKILL_NAME:-warehouse_prod}
      - ./sqlagent/web_static:/app/sqlagent/web_static:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
