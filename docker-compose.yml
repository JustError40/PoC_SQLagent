services:
  postgres:
    image: postgres:16
    container_name: sqlagent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=${POSTGRES_TMPFS_SIZE_BYTES:?Run scripts/campaign_preflight.py first},mode=0700
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    container_name: sqlagent-api-${SKILL_NAME:-warehouse_prod}
    extra_hosts:
      # Reach the LiteLLM proxy (and other services) running on the Docker host.
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${TARGET_DB:-warehouse}
      LLM_PROVIDER: ${LLM_PROVIDER:-litellm}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://host.docker.internal:8445/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env}
      LITELLM_MODEL: ${LITELLM_MODEL:-hosted_vllm/gemma4-chat}
      OPENCODE_GO_BASE_URL: ${OPENCODE_GO_BASE_URL:-https://opencode.ai/zen/go/v1}
      OPENCODE_GO_API_KEY: ${OPENCODE_GO_API_KEY:-}
      OPENCODE_GO_MODEL: ${OPENCODE_GO_MODEL:-deepseek-v4-flash}
      RUN_ID: ${RUN_ID:?Set a unique RUN_ID for this campaign}
      RUNS_ROOT: /app/runs
      WORKSPACE_PATH: /app/runs/${RUN_ID}/skill
      EXPLORER_ROUNDS: ${EXPLORER_ROUNDS:-3}
      EXPLORER_PROBES_PER_ROUND: ${EXPLORER_PROBES_PER_ROUND:-3}
      REACT_MAX_ATTEMPTS: ${REACT_MAX_ATTEMPTS:-15}
      REACT_OPTIMIZE_MS: ${REACT_OPTIMIZE_MS:-10000}
      STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-120000}
      BOOTSTRAP_ON_START: ${BOOTSTRAP_ON_START:-1}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./runs:/app/runs
      - ./sqlagent/web_static:/app/sqlagent/web_static:ro
    depends_on:
      postgres:
        condition: service_healthy

  loader:
    profiles: ["campaign"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    entrypoint: ["python", "-m", "sqlagent"]
    command: ["tpcds-bootstrap", "--scale", "${TPCDS_SCALE:-10}", "--replace"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-warehouse}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-warehouse}
      TPCDS_SCALE: ${TPCDS_SCALE:-10}
      TPCDS_DATA_PATH: /app/.data/tpcds/sf${TPCDS_SCALE:-10}
      TPCDS_TOOLKIT_PATH: /app/.cache/tpcds-kit
    volumes:
      - ./.data/tpcds:/app/.data/tpcds:ro
      - ./.cache/tpcds-kit:/app/.cache/tpcds-kit:ro
    depends_on:
      postgres:
        condition: service_healthy
