    (K-12)") AS total_enrollment FROM schools s LEFT JOIN frpm f ON s.cdscode = f.cdscode
    GROUP BY s.cdscode, f."School Type" HAVING COUNT(f.cdscode) > 1) AS school_counts
  source: explorer
  confidence: 0.7
