rules:
- rule: cdscode must be present and matching in both frpm and schools tables for valid
    enrollment data
  source: explorer
  confidence: 0.7
- rule: SELECT COUNT(*) as total_rows, COUNT("Enrollment (K-12)") as non_null_count,
    SUM(CASE WHEN "Enrollment (K-12)" IS NULL THEN 1 ELSE 0 END) as null_count FROM
    frpm WHERE "Academic Year" IS NOT NULL; -- Check for null enrollment values
  source: explorer
  confidence: 0.7
- rule: SELECT column_name, COUNT(*) FILTER (WHERE column_name IS NULL) as null_count,
    COUNT(*) as total_count FROM table_name GROUP BY column_name
  source: explorer
  confidence: 0.7
- rule: SELECT COUNT(*) FILTER (WHERE frpm.cdscode IS NOT NULL) FROM frpm LEFT JOIN
    schools ON frpm.cdscode = schools.cdscode; -- Verify join integrity, should equal
    total frpm count
  source: explorer
  confidence: 0.7
- rule: SELECT COUNT(*) as total_records, COUNT(CASE WHEN avgscrmath IS NULL THEN
    1 END) as null_math, COUNT(CASE WHEN avgscrwrite IS NULL THEN 1 END) as null_write,
    COUNT(CASE WHEN avgscrread IS NULL THEN 1 END) as null_read FROM satscores WHERE
    total_records > 0
  source: explorer
  confidence: 0.7
- rule: SELECT (SELECT COUNT(*) FROM left_table) as left_rows, (SELECT COUNT(*) FROM
    right_table) as right_rows, (SELECT COUNT(*) FROM left_table JOIN right_table
    ON left_table.key = right_table.key) as joined_rows
  source: explorer
  confidence: 0.7
- rule: Check null distribution and value range of Enrollment (K-12) column in frpm
    table to validate data quality
  source: explorer
  confidence: 0.7
- rule: SELECT COUNT(*) as total_rows, SUM(CASE WHEN "Enrollment (K-12)" IS NULL THEN
    1 ELSE 0 END) as null_count, AVG("Enrollment (K-12)") as avg_enrollment FROM frpm
    WHERE "Enrollment (K-12)" IS NOT NULL
  source: explorer
  confidence: 0.7
- rule: SELECT COUNT(*) FROM satscores WHERE avgscrread IS NULL;
  source: explorer
  confidence: 0.7
- rule: When calculating SAT score percentages, always use CAST(COUNT(field IS NOT
    NULL) AS DOUBLE PRECISION) * 100.0 / COUNT(*) to avoid integer division errors
    and ROUND to prevent floating point precision issues
  source: explorer
  confidence: 0.7
- rule: SELECT COUNT(*) FROM frpm WHERE cdscode NOT IN (SELECT cdscode FROM schools)
  source: explorer
  confidence: 0.7
- rule: JOIN frpm and schools on cdscode to validate school charter mappings; charternum
