- rule: 'SELECT m.member_id, COUNT(i.income_id) AS income_count FROM member m INNER
    JOIN income i ON m.member_id = i.link_to_member GROUP BY m.member_id, m.first_name,
    m.last_name HAVING COUNT(i.income_id) > 1 ORDER BY income_count DESC LIMIT 20
    -- Data quality check: identify members with multiple income records'
