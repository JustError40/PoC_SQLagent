rules:
- rule: SELECT approved, COUNT(*) as count FROM expense GROUP BY approved ORDER BY
    approved
  source: explorer
  confidence: 0.7
- rule: SELECT parent_column, COUNT(*) as child_count, SUM(child_value) as total FROM
    child_table JOIN parent_table ON child_table.link_to = parent_table.id_column
    GROUP BY parent_column HAVING COUNT(*) > 1 ORDER BY child_count DESC LIMIT 10
  source: explorer
  confidence: 0.7
- rule: SELECT m.member_id, m.link_to_major, COUNT(*) AS member_count FROM member
    m WHERE m.link_to_major IS NOT NULL GROUP BY m.link_to_major, m.member_id HAVING
    COUNT(*) > 1 ORDER BY member_count DESC LIMIT 100
  source: explorer
  confidence: 0.7
- rule: expense.approved::boolean = TRUE
  source: explorer
  confidence: 0.7
- rule: SELECT COUNT(*) as total_members, COUNT(DISTINCT m.zip) as distinct_zip_values,
    COUNT(DISTINCT z.zip_code) as distinct_zip_codes, SUM(CASE WHEN m.zip = z.zip_code
    THEN 1 ELSE 0 END) as matching_count FROM member m LEFT JOIN zip_code z ON m.zip
    = z.zip_code GROUP BY m.zip
  source: explorer
  confidence: 0.7
- rule: Filter event budgets by event_status before aggregation to prevent NULL status
    data from skewing financial metrics
  source: explorer
  confidence: 0.7
- rule: SELECT m.member_id, COUNT(CASE WHEN e.approved = 'true' THEN 1 END) as approved_count,
    COUNT(CASE WHEN e.approved = 'false' THEN 1 END) as rejected_count FROM member
    m INNER JOIN expense e ON m.member_id = e.link_to_member GROUP BY m.member_id
    ORDER BY approved_count DESC
  source: explorer
  confidence: 0.7
- rule: Verify fanout pattern for expense.link_to_member by calculating average expenses
    per member to confirm documented cardinality constraints
  source: explorer
  confidence: 0.7
- rule: SELECT approved, COUNT(*) as expense_count, SUM(cost) as total_cost FROM expense
    GROUP BY approved ORDER BY approved DESC
  source: explorer
  confidence: 0.7
- rule: 'Track expense approval status by member: use approved::boolean in CASE expressions
    to count approved/rejected expenses per member'
  source: explorer
  confidence: 0.7
- rule: SELECT CASE WHEN expense.approved = 'true' THEN 'approved' ELSE 'rejected'
    END as approval_status, COUNT(*) as count FROM expense GROUP BY approved ORDER
    BY approval_status
  source: explorer
  confidence: 0.7
- rule: All expense approvals must be tracked per member and approved/rejected counts
    should be aggregated separately
  source: explorer
  confidence: 0.7
- rule: SELECT m.member_id, COUNT(e.expense_id) as expense_count FROM member m INNER
    JOIN expense e ON e.link_to_member = m.member_id GROUP BY m.member_id HAVING expense_count
    > 0
  source: explorer
  confidence: 0.7
- rule: SELECT e.event_id, COUNT(a.link_to_member) as attendance_count FROM event
    e INNER JOIN attendance a ON a.link_to_event = e.event_id GROUP BY e.event_id
    HAVING attendance_count > 0
  source: explorer
  confidence: 0.7
- rule: SELECT t_shirt_size, COUNT(*) as count FROM member GROUP BY t_shirt_size ORDER
