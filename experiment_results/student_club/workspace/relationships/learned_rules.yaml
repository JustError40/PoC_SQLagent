  source: explorer
  confidence: 0.7
- rule: SELECT e.event_id, COUNT(b.budget_id) as budget_count FROM event e LEFT JOIN
    budget b ON b.link_to_event = e.event_id GROUP BY e.event_id HAVING COUNT(b.budget_id)
    > 1
  source: explorer
  confidence: 0.7
- rule: SELECT COUNT(DISTINCT attendance.link_to_member) as attendance_count FROM
    attendance WHERE attendance.link_to_event IN (SELECT event_id FROM event);
