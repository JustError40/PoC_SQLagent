tables:
- name: customers
  description: This table stores customer records with unique identifiers, market
    segments (such as SME, LAM, or KAM), and currency (such as CZK or EUR).
  grain: one row per customer
  columns:
  - column_name: customerid
    data_type: bigint
    is_nullable: 'NO'
    ordinal_position: 1
  - column_name: segment
    data_type: text
    is_nullable: 'YES'
    ordinal_position: 2
  - column_name: currency
    data_type: text
    is_nullable: 'YES'
    ordinal_position: 3
- name: gasstations
  description: This table stores gas station records identified by unique IDs, chain
    affiliations, country codes, and market segments such as Premium or Discount.
  grain: one row per gas station
  columns:
  - column_name: gasstationid
    data_type: bigint
    is_nullable: 'NO'
    ordinal_position: 1
  - column_name: chainid
    data_type: bigint
    is_nullable: 'YES'
    ordinal_position: 2
  - column_name: country
    data_type: text
    is_nullable: 'YES'
    ordinal_position: 3
  - column_name: segment
    data_type: text
    is_nullable: 'YES'
    ordinal_position: 4
- name: products
  description: This table stores unique product identifiers and text descriptions,
    with productids ranging from 1 to 630 and descriptions including values like '55
    - Acquirer Simple Fee'.
  grain: one row per product
  columns:
  - column_name: productid
    data_type: bigint
    is_nullable: 'NO'
    ordinal_position: 1
  - column_name: description
    data_type: text
    is_nullable: 'YES'
    ordinal_position: 2
- name: transactions_1k
  description: Records individual transaction events with unique identifiers, timestamps,
    and monetary values associated with customers, cards, gas stations, and products.
  grain: one row per transaction event
  columns:
  - column_name: transactionid
    data_type: bigint
    is_nullable: 'NO'
    ordinal_position: 1
  - column_name: date
    data_type: date
    is_nullable: 'YES'
    ordinal_position: 2
  - column_name: time
    data_type: text
    is_nullable: 'YES'
    ordinal_position: 3
  - column_name: customerid
    data_type: bigint
    is_nullable: 'YES'
    ordinal_position: 4
  - column_name: cardid
    data_type: bigint
    is_nullable: 'YES'
    ordinal_position: 5
  - column_name: gasstationid
    data_type: bigint
    is_nullable: 'YES'
    ordinal_position: 6
  - column_name: productid
    data_type: bigint
    is_nullable: 'YES'
    ordinal_position: 7
  - column_name: amount
    data_type: bigint
    is_nullable: 'YES'
    ordinal_position: 8
  - column_name: price
    data_type: real
    is_nullable: 'YES'
    ordinal_position: 9
- name: yearmonth
  description: This table stores consumption records for customers identified by customerid,
    with dates formatted as YYYYMM strings ranging from 201112 to 201311.
  grain: one row per customer per month
  columns:
  - column_name: customerid
    data_type: bigint
    is_nullable: 'YES'
    ordinal_position: 1
  - column_name: date
    data_type: text
    is_nullable: 'YES'
    ordinal_position: 2
  - column_name: consumption
    data_type: real
    is_nullable: 'YES'
    ordinal_position: 3
